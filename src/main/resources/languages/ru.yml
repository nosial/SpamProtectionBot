help_pages:
  main_title: "Справка"
  main_body: "Используйте кнопки ниже, чтобы узнать о каждой функции.\n\n<b>Общие</b>\n\u2022 <code>/help</code> \u2014 Показать это меню справки\n\u2022 <code>/start</code> \u2014 Добавить бота в группу или открыть личное меню\n\u2022 <code>/settings</code> \u2014 Открыть меню настроек\n\u2022 <code>/language</code> \u2014 Изменить язык (синоним: <code>/lang</code>)\n\u2022 <code>/ping</code> \u2014 Проверить статус бота и сервера Федерации\n\n<b>Защита чата</b>\n\u2022 <code>/report</code> \u2014 Пожаловаться на сообщение или найти существующую жалобу по UUID\n\u2022 <code>/connect</code> \u2014 Привязать чат или канал для уведомлений\n\n<b>Проверка в Федерации</b>\n\u2022 <code>/info</code> \u2014 Запросить запись и рекомендации Федерации по объекту\n\u2022 <code>/evidence</code> \u2014 Найти запись доказательства в Федерации по UUID\n\n<b>Операторы Федерации</b>\n\u2022 <code>/auth</code> \u2014 Авторизоваться с помощью токена доступа Федерации\n\u2022 <code>/authinfo</code> \u2014 Показать данные оператора и права доступа\n\u2022 <code>/deauth</code> \u2014 Выйти из системы\n\u2022 <code>/blacklist</code> \u2014 Внести объект в черный список по жалобе\n\u2022 <code>/link</code> \u2014 Связать два объекта Федерации"
  secretary_mode_title: "Режим секретаря"
  secretary_mode_body: "<b>Режим секретаря</b>\n\nРежим секретаря защищает личные сообщения от незнакомых контактов. Чтобы использовать его, откройте Telegram \u2192 Настройки \u2192 Аккаунт \u2192 Автоматизация чатов, подключите бота и предоставьте ему разрешения <b>Чтение сообщений</b> и <b>Удаление полученных сообщений</b>.\n\nКогда неизвестный контакт пишет вам впервые, бот проверяет его через сервер Федерации и реагирует в соответствии с выбранным режимом:\n\n\u2022 <b>Пассивный</b> \u2014 Первое сообщение всегда разрешено и сохраняется. Вы получаете уведомление о каждом решении и можете при необходимости изменить статус контакта.\n\u2022 <b>Строгий</b> \u2014 Контакт автоматически разрешается или заносится в черный список. Сообщения от заблокированных удаляются, о каждом решении приходит уведомление.\n\nКаждое уведомление содержит кнопки <b>Разрешить</b> и <b>Заблокировать</b>. Если контакт разрешен, он становится доверенным; если заблокирован — его сообщения удаляются без шума. Вы также можете управлять контактами в меню «Секретарь»."
  chat_protection_title: "Защита чата"
  chat_protection_body: "<b>Защита чата</b>\n\nЗащита чата превращает бота в модератора против спама и нарушений в группе. Добавьте бота в группу, назначьте администратором и включите защиту через меню конфигурации по команде <code>/start</code> или <code>/settings</code>. Доступные функции:\n\n\u2022 <b>Сканирование</b> \u2014 Сообщения проверяются через сервер Федерации на спам, фишинг, вирусы и другие угрозы. Бот может уведомлять модераторов, удалять контент, ограничивать или банить отправителя.\n\u2022 <b>Защита входа</b> \u2014 Новые участники проверяются при входе, что позволяет ограничить или отклонить злоумышленников до того, как они нанесут вред.\n\u2022 <b>Система жалоб</b> \u2014 Участники могут использовать <code>/report</code>, чтобы отметить сообщения. Жалобы отправляются в сеть Федерации. Для работы функции требуется токен доступа с правами клиента.\n\nКаждая функция имеет свой уровень защиты и настройки уведомлений."
  settings_title: "Настройки"
  settings_body: "Команда <code>/settings</code> открывает меню конфигурации бота, где можно включать/выключать функции и изменять их поведение.\n\nВыберите параметр ниже, чтобы узнать больше."
  settings_scanning_title: "Сканирование"
  settings_scanning_body: "Сканирование работает только в групповых чатах. При включении бот проверяет каждое сообщение на предмет спама, фишинга, вирусов и других угроз. Если Режим приватности отключен, также проверяется профиль автора. Реакция бота зависит от выбранного режима:\n\n\u2022 <b>Пассивный</b> \u2014 Только уведомляет модераторов; автоматические действия не предпринимаются.\n\u2022 <b>Умеренный</b> \u2014 Заблокированный контент удаляется, а пользователи с рекомендацией блокировки от Федерации ограничиваются.\n\u2022 <b>Строгий</b> \u2014 Заблокированный контент удаляется, подозрительным участникам разрешается отправка только текста, а рекомендованные к блокировке участники банятся.\n\nПодозрительные сообщения без текста, с медиафайлами или ссылками удаляются на уровнях «Умеренный» и «Строгий». Обычные текстовые сообщения без ссылок сохраняются."
  settings_join_protection_title: "Защита входа"
  settings_join_protection_body: "Защита входа работает только в групповых чатах. При включении каждый новый участник проверяется по базе Федерации во время входа:\n\n\u2022 <b>Пассивный</b> \u2014 Все входы одобряются, а рекомендации к блокировке передаются модераторам.\n\u2022 <b>Умеренный</b> \u2014 Вход одобряется, но нарушители ограничиваются в правах. Заявки на вступление от заблокированных пользователей могут быть отклонены.\n\u2022 <b>Строгий</b> \u2014 Пользователи с рекомендацией к блокировке банятся, а их заявки на вступление отклоняются.\n\nВ режиме приватности бот опрашивает данные нового пользователя для защиты чата, но не публикует его профиль."
  settings_reporting_title: "Жалобы"
  settings_reporting_body: "Функция отправки жалоб работает только в групповых чатах. Участники могут ответить на сообщение командой <code>/report</code>, чтобы отправить жалобу. Каждая жалоба включает тип нарушения и само сообщение.\n\nУведомления направляются модераторам, а копия отправляется на сервер Федерации для улучшения баз данных. В Режиме приватности передается только минимально необходимый объем данных: нарушитель, тип, текст и комментарий."
  settings_privacy_title: "Режим приватности"
  settings_privacy_body: "Режим приватности минимизирует регулярную передачу данных на сервер Федерации. Он отключает автоматическую публикацию пользователей и настраивает сканирование только по тексту сообщений без проверки профиля отправителя.\n\nФункции, требующие данных для работы, передают строго необходимый минимум."
  settings_moderator_notifications_title: "Уведомления модераторов"
  settings_moderator_notifications_body: "Уведомления модераторов работают только в группах. При включении каждый активный модератор с правом удаления сообщений или бана получает личные оповещения о действиях бота (сканирование, защита входа, жалобы)."
  settings_channel_linking_title: "Привязка чата"
  settings_channel_linking_body: "Привязка чата работает только в группах. Позволяет подключить отдельный канал или группу, куда будут дублироваться модераторские уведомления для ведения журнала действий. Бот должен быть участником привязываемого чата."
  federation_commands_title: "Команды Федерации"
  federation_commands_body: "<b>Команды Федерации</b>\n\nЭти команды запрашивают информацию из Федерации или отправляют жалобы. Доступны в любом чате.\n\n\u2022 <code>/info [цель]</code> \u2014 Запрос информации об объекте в Федерации: репутация, белый список, связи и рекомендации. Если вы ответите на сообщение, будет проверен его автор; если отправить команду просто так — проверятся ваши данные. В качестве цели можно указывать username, ID, UUID или хэш.\n\u2022 <code>/evidence &lt;uuid&gt;</code> \u2014 Поиск записи доказательства по ID. Показывает классификацию, содержимое, заметки и источник.\n\u2022 <code>/report</code> \u2014 Ответьте на сообщение в группе командой <code>/report</code>, чтобы открыть диалог отправки жалобы, или введите <code>/report &lt;тип&gt; [комментарий]</code> для быстрой отправки.\n\u2022 <code>/report &lt;uuid&gt;</code> \u2014 Просмотр информации о существующей жалобе по её UUID."
  operator_usage_title: "Инструкции для операторов"
  operator_usage_body: "Раздел для операторов Федерации, авторизованных с помощью <code>/auth</code>. Эти команды выполняются с личными правами оператора.\n\nВыберите тему ниже, чтобы узнать больше."
  operator_authentication_title: "Авторизация"
  operator_authentication_body: "<b>Авторизация</b>\n\nАвторизует вас как оператора Федерации с помощью токена доступа. Используется в личных сообщениях с ботом.\n\n\u2022 <code>/auth &lt;access_token&gt;</code> \u2014 Вход с помощью токена.\n\u2022 <code>/authinfo</code> \u2014 Просмотр текущего профиля оператора и прав.\n\u2022 <code>/deauth</code> \u2014 Выход из системы и удаление сохраненного токена."
  operator_blacklist_title: "Черный список"
  operator_blacklist_body: "<b>Внесение в черный список</b>\n\nКоманда <code>/blacklist</code> добавляет объект в черный список Федерации на основе жалобы. Поддерживает три формата:\n\n\u2022 <code>/blacklist &lt;идентификатор&gt; &lt;uuid_жалобы&gt; &lt;тип&gt; &lt;срок&gt;</code> \u2014 внести объект по существующей жалобе.\n\u2022 <code>/blacklist &lt;uuid_жалобы&gt; &lt;тип&gt; &lt;срок&gt;</code> (в ответ на сообщение) \u2014 внести автора сообщения по существующей жалобе.\n\u2022 <code>/blacklist &lt;тип&gt; &lt;срок&gt;</code> (в ответ на сообщение) \u2014 создать жалобу и сразу занести автора в черный список.\n\nПараметр <code>срок</code> задается с суффиксами времени (<code>s</code>, <code>m</code>, <code>h</code>, <code>d</code>), например: <code>30d</code> или <code>12h</code>."
  operator_linking_title: "Связывание объектов"
  operator_linking_body: "<b>Связывание объектов</b>\n\nКоманда <code>/link &lt;объект&gt; &lt;цель&gt; &lt;тип&gt;</code> записывает связь между объектами:\n\n• <b>alternative</b> — <code>объект</code> подозревается как твинк/альтернативный аккаунт <code>цели</code>.\n• <b>proxy</b> — <code>объект</code> подтвержден как прокси, действующий от имени <code>цели</code>.\n• <b>child</b> — <code>объект</code> был создан <code>целью</code> как подчиненный аккаунт (например, бот).\n\nКаждый объект может иметь только одну исходящую связь — повторное связывание перезапишет предыдущую цель."
  operator_report_assignments_title: "Назначенные жалобы"
  operator_report_assignments_body: "<b>Назначенные жалобы</b>\n\nКогда вам назначается жалоба, в личные сообщения приходит уведомление <code>#REPORT_ASSIGNED</code>. Оно содержит ID жалобы, тип, данные нарушителя, доказательства и комментарий.\n\nИспользуйте кнопки под уведомлением, чтобы закрыть жалобу со статусом <b>Нормальный</b>, <b>Подозрительный</b> или <b>Вредоносный</b>. Действие кнопок истекает через <b>8 часов</b>."
link:
  usage: "Использование: <code>/link &lt;объект&gt; &lt;цель&gt; &lt;тип&gt;</code>. В качестве объекта и цели можно использовать имя пользователя, ID Telegram, упоминание, UUID Федерации, хэш или адрес объекта. Тип должен быть одним из: <code>alternative</code>, <code>proxy</code> или <code>child</code>."
  not_authenticated: "Вы не авторизованы как оператор Федерации. Сначала используйте <code>/auth &lt;token&gt;</code>."
