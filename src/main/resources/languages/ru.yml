start:
  channel_message: "Сообщение из канала"
  session_expired_private: "Сессия настройки истекла или недействительна для вас. Отправьте /start в группе снова, чтобы настроить бота."
  startgroup_promote: "Чтобы начать, назначьте бота администратором с разрешением <b>Изменение профиля группы</b>, затем отправьте /start в этот чат."
  private_description: "Это клиент Open Federated Database с открытым исходным кодом для Telegram, позволяющий администраторам защищать групповые чаты от спама и нарушений.\n\n"
  getting_started_header: "<b>Начало работы</b>\n"
  getting_started_private_body: "Добавьте бота в групповой чат и назначьте его администратором с необходимыми правами, чтобы защитить чат от спамеров.\n\nИли откройте Telegram \u2192 Настройки \u2192 Аккаунт \u2192 Автоматизация чатов, подключите бота и дайте ему разрешения <b>Чтение сообщений</b> и <b>Удаление полученных сообщений</b>, чтобы защитить себя от неизвестных контактов.\n"
  getting_started_group_configurable: "Бота можно настроить в личных сообщениях, нажав кнопку «Настроить» ниже.\n"
  getting_started_group_permissions: "Чтобы начать, убедитесь, что боту предоставлены следующие разрешения:\n\u2022 Изменение профиля группы\n\u2022 Удаление сообщений (опционально)\n\u2022 Блокировка пользователей (опционально)\nПосле настройки отправьте команду /start снова\n"
  additional_help_header: "\n<b>Справка</b>\n"
  additional_help_body: "Отправьте /help, чтобы открыть меню справки бота с описанием доступных команд и принципов их работы.\n"
  server_information_header: "\n<b>Информация о сервере</b>\n"
  server_name_label: "<b>Имя сервера:</b> {0}\n"
  server_host_label: "<b>Хост сервера:</b> {0}\n"
  server_api_version_label: "<b>Версия API сервера:</b> {0}\n"
  server_footer: "\n<i>Сервер {0} {1}</i>"

settings:
  bot_admin_required: "Бот должен быть администратором с разрешением <b>Изменение профиля группы</b>, чтобы отобразить меню настроек."
  secretary_not_enabled: "<b>Режим секретаря отключен.</b>\n\nЧтобы настроить защиту группы, добавьте бота в группу и отправьте там <code>/start</code>. Чтобы использовать режим секретаря, откройте Telegram \u2192 Настройки \u2192 Telegram для бизнеса и добавьте бота в качестве менеджера, предоставив разрешение на удаление сообщений."

secretary:
  enabled_title: "\U0001F464 <b>Режим секретаря включен</b>\n\n"
  enabled_body: "Вы назначили меня своим личным секретарем. Сообщения от ранее незнакомых людей теперь проверяются. Федерация сканирует их сообщения или запрашивает записи, рекомендуя необходимые действия."
  disabled_title: "\U0001F464 <b>Режим секретаря отключен</b>\n\n"
  disabled_body: "Подключение секретаря отключено, а ваши настройки удалены. Сообщения, поступающие на ваш аккаунт, больше не обрабатываются."
  missing_permissions_title: "\u26A0\uFE0F <b>Недостаточно разрешений</b>\n\n"
  missing_permissions_body: "Для работы в качестве секретаря мне требуются следующие разрешения в Telegram для бизнеса:"
