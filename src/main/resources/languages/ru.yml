secretary_settings:
  title: "\U0001F464 <b>Настройки секретаря</b>\n\n"
  description: "Выберите, как режим секретаря должен обрабатывать новые контакты. Секретарь ведет список разрешенных и заблокированных контактов. Сообщения от разрешенных контактов доставляются как обычно без удаления и сканирования, тогда как сообщения от заблокированных — автоматически удаляются. Сообщения от неизвестных контактов проверяются через сервер Федерации для принятия решения."
  behavior: "<b>Режим:</b> {0}"
  behavior_passive: "Пассивный"
  behavior_passive_description: "Только отправляет уведомления и оставляет выбор за вами. Новые контакты разрешаются, их первое сообщение остается в чате после проверки по базе Федерации, а вам отправляется уведомление с кнопками «Разрешить» и «Заблокировать»."
  behavior_strict: "Строгий"
  behavior_strict_description: "Автоматически применяет блокировку. Новые контакты разрешаются или блокируются на основе рекомендаций; заблокированные сообщения удаляются, а вам отправляется уведомление с возможностью изменить статус контакта."
  contact_not_known: "\U0001F4AC <b>Неизвестный контакт</b>\n\nКогда новый пользователь пишет вам впервые, он проверяется по базе данных Федерации. Затем он автоматически разрешается или блокируется, а вы получаете уведомление."
  contact_not_known_button: "Открыть настройки секретаря"
  contact_unknown: "Неизвестен"
  contact_allowed: "Разрешен"
  contact_denied: "Заблокирован"
  contact_title: "<b>Настройки контакта</b>\n\n"
  contact_status: "<b>Статус:</b> {0}\n"
  contact_not_known_hint: "<i>Этот контакт еще не внесен в список разрешенных или заблокированных.</i>\n\n"
  toast_behavior_changed: "Режим работы секретаря изменен на {0}."
  toast_contact_allowed: "Контакт разрешен."
  toast_contact_denied: "Контакт заблокирован."
  not_enabled: "\u26A0\uFE0F <b>Режим секретаря не включен.</b>\n\nОткройте Telegram \u2192 Настройки \u2192 Telegram для бизнеса, подключите бота и дайте ему разрешение на удаление сообщений. Ограничение будет снято, как только связь установится."

