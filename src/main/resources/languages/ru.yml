    federation_api_version: "<b>Версия API:</b> {0}"
    federation_access: "<b>Доступ:</b> {0}"
    federation_access_authenticated: "Авторизован (права клиента)"
    federation_access_anonymous: "Анонимный"
  scanning:
    title: "\U0001F50E <b>Сканирование</b>\n\n"
    description: "Проверяет сообщения участников на предмет спама, фишинга, вредоносного ПО и других угроз. Реакция бота зависит от выбранного режима.\n\n"
    privacy_mode_note: "При сканировании отправляется только текст сообщения или подпись. Данные отправителя не публикуются и не запрашиваются из Федерации."
    status: "<b>Статус:</b> {0}"
    level: "<b>Уровень:</b> {0}"
    notifications: "<b>Уведомления:</b> {0}"
    notifications_unavailable: "<b>Уведомления:</b> Недоступны \u2014 включите уведомления модераторов или привяжите чат"
    behavior_passive: "Пассивный"
    behavior_passive_description: "Только отправляет уведомления без автоматических действий. Доступно только при включенных уведомлениях сканирования."
    behavior_moderate: "Умеренный"
    behavior_moderate_description: "Удаляет заблокированный контент и ограничивает участников, которых Федерация рекомендует заблокировать. Подозрительные сообщения удаляются, если они содержат медиа или ссылки."
    behavior_strict: "Строгий"
    behavior_strict_description: "Удаляет заблокированный контент, ограничивает подозрительных участников до текстовых сообщений и банит пользователей по рекомендации Федерации."
  join_protection:
    title: "\U0001F6C2 <b>Защита входа</b>\n\n"
    description: "Проверяет новых участников при входе по базе Федерации. Пассивный режим одобряет вход и уведомляет модераторов. Умеренный одобряет вход, но ограничивает нарушителей и может отклонять заявки. Строгий банит рекомендованных пользователей и отклоняет их заявки на вступление.\n\n"
    privacy_mode_note: "Защита входа делает запрос по новому участнику для защиты чата, но не публикует его профиль или метаданные."
    status: "<b>Статус:</b> {0}"
    level: "<b>Уровень:</b> {0}"
    notifications: "<b>Уведомления:</b> {0}"
    notifications_unavailable: "<b>Уведомления:</b> Недоступны \u2014 включите уведомления модераторов или привяжите чат"
    behavior_moderate: "Умеренный"
    behavior_moderate_description: "Одобряет участников, но ограничивает рекомендованных к блокировке. Может отклонять заявки на вступление."
    behavior_passive: "Пассивный"
    behavior_passive_description: "Одобряет участников без автоматических ограничений или банов. Передает рекомендации Федерации модераторам."
    behavior_strict: "Строгий"
    behavior_strict_description: "Банит участников по рекомендации Федерации (вменно или навсегда) и отклоняет их заявки на вступление."
  privacy:
    title: "\U0001F6E1\uFE0F <b>Режим приватности</b>\n\n"
    description: "Минимизирует передачу данных в Федерацию. Отключает автоматическую публикацию объектов и передает только текст сообщений без запроса данных отправителя. Необходимые функции продолжают передавать минимальный объем данных (например, Защита входа или отправка жалоб).\n\n"
    status: "<b>Статус:</b> {0}"
  reporting:
    title: "\U0001F4DD <b>Жалобы</b>\n\n"
    description: "Позволяет участникам пожаловаться на сообщение с помощью <code>/report</code>. Жалобы включают выбранный тип нарушения и само сообщение в качестве доказательства.\n\n"
    privacy_mode_note: "Жалобы по-прежнему содержат данные о нарушителе, типе инцидента, тексте сообщения и комментарии. Метаданные чата, отправителя и вложения исключаются."
    status: "<b>Статус:</b> {0}"
    notifications: "<b>Уведомления:</b> {0}"
    notifications_unavailable: "<b>Уведомления:</b> Недоступны \u2014 включите уведомления модераторов или привяжите чат"
  moderator_notifications:
    title: "\U0001F514 <b>Уведомления модераторов</b>\n\n"
    description: "При включении каждый активный модератор с правом удаления сообщений или ограничения участников получает личные уведомления.\n\n"
    status: "<b>Статус:</b> {0}"
  channel:
    title: "\U0001F517 <b>Привязка чата</b>\n\n"
    description: "Подключите канал или группу для получения модераторских уведомлений. Бот должен присутствовать в целевом чате.\n\n"
