  operator_only: "Эта команда доступна только авторизованным операторам. Сначала используйте <code>/auth &lt;access_token&gt;</code>."
  usage: "<b>Использование</b>\n\n<code>/blacklist &lt;идентификатор&gt; &lt;uuid_жалобы&gt; &lt;тип&gt; &lt;срок&gt;</code> — внести объект в черный список по существующей жалобе.\nОтветьте на сообщение и введите <code>/blacklist &lt;uuid_жалобы&gt; &lt;тип&gt; &lt;срок&gt;</code>, чтобы внести автора сообщения в черный список.\nОтветьте на сообщение и введите <code>/blacklist &lt;тип&gt; &lt;срок&gt;</code>, чтобы создать жалобу и занести автора сообщения в черный список.\n\n<code>срок</code> принимает значение с единицей времени (<code>s</code>, <code>m</code>, <code>h</code> или <code>d</code>; числа по умолчанию означают секунды), например: <code>30d</code> или <code>12h</code>."
