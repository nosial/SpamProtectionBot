  secretary_not_enabled: "<b>Secretary mode is disabled.</b>\n\nTo configure group protection, add the bot to a group and send <code>/start</code> there. To use secretary mode, open Telegram \u2192 Settings \u2192 Business and add this bot as a manager, granting permission to delete messages."

