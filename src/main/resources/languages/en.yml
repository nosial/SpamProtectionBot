start:
  channel_message: "Channel Message"
  session_expired_private: "This configuration session has expired or is not valid for you. Send /start in the group again to configure the bot."
  startgroup_promote: "To get started, promote this bot to an administrator with the <b>Change Group Information</b> permission, then send /start in this chat."
  private_description: "This is an open source Open Federated Database client for Telegram, allowing group administrators to protect group chats from abuse &amp; spam.\n\n"
  getting_started_header: "<b>Getting Started</b>\n"
  getting_started_private_body: "Add this bot to a group chat and promote it to administrator with the required permissions to protect the chat against spammers.\n\nOr open Telegram \u2192 Settings \u2192 Account \u2192 Chat Automation, connect this bot, and grant it the <b>Read Messages</b> and <b>Delete Received Messages</b> permissions to protect yourself against unknown contacts.\n"
  getting_started_group_configurable: "The bot can be configured privately by clicking the Configure button below.\n"
  getting_started_group_permissions: "To get started, ensure that this bot has the following permissions:\n\u2022 Change Group Information\n\u2022 Delete Messages (Optional)\n\u2022 Ban Users (Optional)\nOnce configured, send the /start command again\n"
  additional_help_header: "\n<b>Help</b>\n"
  additional_help_body: "Send /help to open the bot's help menu, which explains what commands are available and how they work.\n"
  server_information_header: "\n<b>Server Information</b>\n"
  server_name_label: "<b>Server Name:</b> {0}\n"
  server_host_label: "<b>Server Host:</b> {0}\n"
